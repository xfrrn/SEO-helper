<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEO Helper · Google Trends 词义分析</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <nav class="feature-nav" aria-label="Google Trends 功能">
    <a id="feature-compare" href="../compare/sidepanel.html">分组对比</a><span aria-current="page">词义分析</span>
    <details id="page-settings">
      <summary>设置</summary>
      <form id="settings-form">
        <label for="baseline-one">基准词一</label><input id="baseline-one" type="text" maxlength="150" required>
        <label for="baseline-two">基准词二</label><input id="baseline-two" type="text" maxlength="150" required>
        <p class="hint">网页翻译与快捷操作自动启用。Google 在线翻译会发送当前显示的外文关键词，无需下载模型或填写 API Key。</p>
        <button id="save-settings" type="submit">保存设置</button>
        <p id="settings-status" role="status" aria-live="polite"></p>
      </form>
    </details>
    <button id="feature-home" type="button">全部功能</button>
  </nav>
  <main>
    <form id="analysis-form">
      <input id="keyword" name="keyword" aria-label="输入一个词或短语" type="text" maxlength="150" placeholder="输入关键词" autocomplete="off" required disabled>
      <button id="analyze" type="submit" disabled>分析</button>
    </form>
    <div class="source-toolbar">
      <div id="providers" role="tablist" aria-label="分析方式"></div>
      <div id="result-toolbar" hidden>
        <button id="reload" type="button">重试</button>
        <a id="open-result" class="button" title="无法内嵌或需要登录时，在新标签页打开" target="_blank" rel="noopener noreferrer">跳转</a>
      </div>
    </div>
    <section id="analysis-result" role="tabpanel" tabindex="0">
      <div id="result-frame"></div>
      <div id="external-result" hidden>
        <h2>Ahrefs 免费关键词工具</h2>
        <p>复制关键词后点击“跳转”，粘贴到 Enter keyword 输入框进行查询。</p>
        <button id="copy-keyword" type="button">复制关键词</button>
      </div>
    </section>
  </main>
  <footer hidden><p id="status" role="status" aria-live="polite"></p></footer>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
